
name: Main

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    container:
      image: wulffern/aicex:26.04_latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive
      - name: install cicsim
        run: |
          export PDK_ROOT=/opt/pdk/share/pdk
          export PATH=/opt/eda/bin:$HOME/.local/bin:$PATH
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall cicpy -y
          python3 -m pip install  .
          cicpy --help
          make test
          make docs
      - name: Setup Pages
        uses: actions/configure-pages@main
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@main
        with:
          source: ./docs/
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@main

  # Parity job: compile every corpus design with ciccreator AND cicpy
  # on identical inputs and compare shape for shape. The corpus repos
  # are pulled with cicconf; the reference is built from source.
  parity:
    runs-on: ubuntu-latest
    container:
      image: wulffern/aicex:26.04_latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qt6-base-dev g++ make git
      - name: run parity corpus
        run: |
          export PATH=$HOME/.local/bin:$PATH
          python3 -m pip install --upgrade pip
          python3 -m pip uninstall cicpy -y
          python3 -m pip install . cicconf
          make parity PYTHON=python3

  # Deployment job
  deploy:
    # Pages deploys only from the default branch: the github-pages
    # environment refuses a pull_request run, so this job failed in one
    # second on EVERY PR and put a red X on branches whose tests passed.
    # Skip it on PRs -- build still runs, and still builds the docs.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main
