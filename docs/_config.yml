# Book-style docs on just-the-docs, the same pattern as aic2026's
# docs-book. This site builds with actions/jekyll-build-pages, so the
# theme comes in as a remote theme.

title: cicpy
description: Custom IC Creator Python
author: Carsten Wulff

baseurl: /cicpy
url: https://analogicus.com

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# book feel: page list in the sidebar, search across all of it
search_enabled: true
search:
  heading_level: 2
  preview_words: 20

heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/wulffern/cicpy"
  "analogicus.com":
    - "https://analogicus.com"

callouts:
  note:
    title: Note
    color: blue

kramdown:
  mathjax: true
markdown: kramdown

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

footer_content: "Carsten Wulff &mdash; <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>"
